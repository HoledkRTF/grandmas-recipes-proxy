<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no, viewport-fit=cover" />
		<meta name="apple-mobile-web-app-title" content="Grandma's Recipes">
		
		<title>Grandma's Recipes</title>
		
		<link rel="manifest" href="manifest.json">
		<link rel="apple-touch-icon" href="icon-180.png">
		<link rel="shortcut icon" href="icon-180.png" />
	
		<script src="/scram/scramjet.all.js"></script>
		<script src="/baremux/index.js"></script>
		
		<style>
			body, html {
				margin: 0;
				padding: 0;
				width: 100%;
				height: 100%;
				background-color: #1a1a1a;
				color: #fff;
				font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
				display: flex;
				justify-content: center;
				align-items: center;
				overflow: hidden;
			}
			#loading {
				text-align: center;
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 20px;
			}
			.spinner {
				width: 40px;
				height: 40px;
				border: 4px solid rgba(255, 255, 255, 0.1);
				border-left-color: #1da1f2;
				border-radius: 50%;
				animation: spin 1s linear infinite;
			}
			@keyframes spin {
				0% { transform: rotate(0deg); }
				100% { transform: rotate(360deg); }
			}
			#sj-frame {
				position: fixed;
				top: 0;
				left: 0;
				width: 100vw;
				height: 100vh;
				border: none;
				z-index: 10;
				background-color: #000;
				display: none;
			}
		#token-form {
			display: none;
			width: 280px;
			text-align: left;
		}
		#token-form input {
			width: 100%;
			padding: 10px;
			margin: 6px 0 14px 0;
			border: 1px solid #444;
			border-radius: 8px;
			background: #222;
			color: #fff;
			font-size: 14px;
			box-sizing: border-box;
		}
		#token-form label {
			font-size: 13px;
			opacity: 0.7;
		}
		#token-form button {
			width: 100%;
			padding: 12px;
			border: none;
			border-radius: 8px;
			background: #1da1f2;
			color: #fff;
			font-size: 15px;
			font-weight: 600;
			cursor: pointer;
			margin-top: 4px;
		}
		</style>
		
		<script src="register-sw.js" defer></script>
		<script src="/baremux/index.js" defer></script>
		<script src="/config.js" defer></script>
		<script src="index.js" defer></script>
	</head>

	<body>
		<div id="loading">
			<div id="sj-error" style="color: #ff5555; margin-top: 20px;"></div>
		</div>
	</body>
</html>
